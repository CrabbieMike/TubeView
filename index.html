}

function menu(kind, title, items, cur, pick) {
  const m = $("#p-menu");
  if (!m.hidden && m.dataset.kind === kind) { m.hidden = true; return; }
  m.dataset.kind = kind;
  m.innerHTML = `<h3>${title}</h3>`;
  items.forEach(([label, val]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = val === cur ? "on" : "";
    b.onclick = () => { m.hidden = true; pick(val); render(); };
    m.append(b);
  });
  m.hidden = false;
}

(function initPlayer() {
  const video = pv(), seekEl = $("#p-seek");
  video.volume = pref("volume", 1);
  $("#p-back").innerHTML = svg("back");
  $("#p-rw").innerHTML = svg("rw");
  $("#p-ff").innerHTML = svg("ff");
  $("#p-skip").innerHTML = svg("next");
  $("#p-mini").innerHTML = svg("mini");
  $("#p-pip").innerHTML = svg("pip");
  $("#p-expand").innerHTML = svg("fs");
  $("#p-mini-close").innerHTML = svg("close");
  for (const ev of ["play", "pause"]) video.addEventListener(ev, () => $("#p-mini-play").innerHTML = svg(video.paused ? "play" : "pause"));
  video.addEventListener("loadedmetadata", () => { if (P.local && !P.dur && isFinite(video.duration)) { P.dur = video.duration; renderSegs(); } });
  for (const ev of ["play", "pause", "progress", "volumechange", "ratechange"]) video.addEventListener(ev, render);
  video.addEventListener("pause", showUI);
  video.addEventListener("waiting", () => $("#player").classList.add("loading"));
  video.addEventListener("playing", () => $("#player").classList.remove("loading"));
  video.addEventListener("timeupdate", () => {
    sbTick();
    render();
    if (P.v && !P.live && Date.now() - P.savedAt > 5000) { P.savedAt = Date.now(); if (now() > 10) saveProgress(P.v.id, now(), P.dur); }
  });
  video.addEventListener("ended", () => {
    if (P.loop && P.v) return directSrc() ? (video.currentTime = 0, video.play()) : load(0);
    if (sleepAtEnd()) return;
    if (P.v) saveProgress(P.v.id, null);
    showUI();
    if (pref("autoplay", true)) showNext();
  });
  video.addEventListener("play", hideNext);  // replaying after the end cancels autoplay
  video.addEventListener("error", () => { if (P.v && video.getAttribute("src")) playerError(); });
  document.addEventListener("fullscreenchange", render);

  $("#p-back").onclick = closePlayer;
  $("#p-close").onclick = closePlayer;
  $("#p-mpv").onclick = () => { const v = P.v; closePlayer(); playMpv(v); };
  $("#p-err-in").onclick = () => { closePlayer(); openAccount(); };
  $("#p-play").onclick = $("#p-center").onclick = toggle;
  $("#p-skip").onclick = $("#p-next-play").onclick = playNext;
  $("#p-next-cancel").onclick = hideNext;
  $("#p-rw").onclick = () => seek(now() - pref("skip", 10));
  $("#p-ff").onclick = () => seek(now() + pref("skip", 10));
  $("#p-mute").onclick = () => { video.muted = !video.muted; };
  $("#p-vol").oninput = e => setVol(+e.target.value);
  $("#p-fs").onclick = fullscreen;
  $("#p-rate").onclick = () => menu("rate", "Speed", [0.5, 0.75, 1, 1.25, 1.5, 2].map(r => [r + "×", r]), P.rate,
    r => { P.rate = video.defaultPlaybackRate = video.playbackRate = r; });
  $("#p-q").onclick = () => menu("q", "Quality", [...P.heights.filter(h => h <= 1080 || vp9Ok()).map(h => [h >= 2160 ? "4K" : h + "p", h]),
    ...(P.live ? [] : [["Audio only", 0]])], P.q,
    h => { if (h !== P.q) { P.q = h; setPref("quality", h); load(now()); } });
  // "" = the original track; picking a dub applies to this video only (Settings has a default)
  $("#p-aud").onclick = () => menu("aud", "Audio track", P.audio.map(a => [a.name, a.original ? "" : a.lang]), P.lang,
    lang => { if (lang !== P.lang) { P.lang = lang; load(now()); } });
  $("#p-cc").onclick = () => menu("cc", "Subtitles", [["Off", null], ...P.captions.map(c => [c.name, c])], P.cc, setCC);
  $("#p-ch-btn").onclick = () => menu("chap", "Chapters", P.chapters.map(c => [`${fmtT(c.start)}   ${c.title}`, c]), chapterAt(now()), c => seek(c.start));
  $("#p-mini").onclick = minimizePlayer;
  $("#p-expand").onclick = () => $("#player").classList.contains("pip") ? setAppPip(false) : expandPlayer();
  $("#p-mini-play").onclick = e => { e.stopPropagation(); toggle(); };
  $("#p-mini-close").onclick = e => { e.stopPropagation(); closePlayer(); };
  $("#p-minibar").onclick = e => { if (e.target === e.currentTarget) expandPlayer(); };
  $("#p-pip").onclick = togglePip;

  const ui = $("#p-ui");
  ui.addEventListener("pointermove", showUI);
  ui.addEventListener("click", e => {
    if (!e.target.closest(".p-menu, #p-rate, #p-q, #p-cc, #p-aud, #p-ch-btn")) $("#p-menu").hidden = true;
    if (e.target === ui) toggle();
  });
  ui.addEventListener("dblclick", e => { if (e.target === ui) fullscreen(); });

  const at = e => { const r = $("#p-track").getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * P.dur; };
  const preview = e => {
    const t = at(e), pct = (P.dur ? t / P.dur * 100 : 0) + "%", tip = $("#p-tip"), sb = P.sb;
    $("#p-tip-t").textContent = fmtT(t);
    $("#p-tip-ch").textContent = chapterAt(t)?.title || "";
    // storyboard: pages of rows x cols tiles, one tile per sb.interval seconds
    const i = sb ? Math.floor(t / sb.interval) : -1, per = sb ? sb.rows * sb.cols : 1, page = sb?.pages[Math.floor(i / per)];
    tip.classList.toggle("has-prev", !!page);
    if (page) {
      const k = i % per, sc = 176 / sb.w;
      $("#p-prev").style.cssText = `width:${sb.w * sc}px;height:${sb.h * sc}px;background-image:url("${page}");` +
        `background-size:${sb.w * sb.cols * sc}px ${sb.h * sb.rows * sc}px;background-position:-${(k % sb.cols) * sb.w * sc}px -${Math.floor(k / sb.cols) * sb.h * sc}px`;
    }
    const w = $("#p-track").getBoundingClientRect().width, x = P.dur ? t / P.dur * w : 0, half = page ? 92 : 40;
    tip.style.left = Math.max(half, Math.min(w - half, x)) + "px";
    if (P.drag) { $("#p-prog").style.width = pct; $("#p-knob").style.left = pct; }
  };
  seekEl.onpointermove = preview;
  seekEl.onpointerdown = e => { seekEl.setPointerCapture(e.pointerId); P.drag = true; seekEl.classList.add("drag"); preview(e); };
  seekEl.onpointerup = e => { if (!P.drag) return; P.drag = false; seekEl.classList.remove("drag"); seek(at(e)); showUI(); };
})();

function playerKey(e) {
  const v = pv();
  const act = {
    " ": toggle, k: toggle, j: () => seek(now() - pref("skip", 10)), l: () => seek(now() + pref("skip", 10)),
    ArrowLeft: () => seek(now() - 5), ArrowRight: () => seek(now() + 5),
    ArrowUp: () => setVol(v.volume + .05), ArrowDown: () => setVol(v.volume - .05),
    m: () => { v.muted = !v.muted; }, N: playNext, f: fullscreen, Escape: () => document.fullscreenElement || closePlayer(),
    i: minimizePlayer, p: togglePip, Enter: toggle, Backspace: closePlayer,
    c: () => P.captions.length && setCC(P.cc ? null : P.captions.find(c => !c.auto) || P.captions[0]),
  }[e.key];
  if (!act || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "Enter" && e.target.closest?.("button, select")) return;  // let Enter press the focused control
  e.preventDefault();
  act();
  showUI();
}

addEventListener("keydown", e => {
  if ($("#player").classList.contains("pip")) {
    if (e.key === "Escape") setAppPip(false);
    else if (e.key === " ") { e.preventDefault(); toggle(); }
    return;
  }
  if (!$("#player").hidden && !$("#player").classList.contains("mini")) return playerKey(e);
  const el = document.activeElement;
  // a drop-down doesn't count: on a TV the arrows move past it, and OK opens it
  let typing = ["INPUT", "TEXTAREA"].includes(el.tagName) && el.type !== "checkbox" && !el._tvLock;
  // in a text box, up/down (and left/right past either end) move on to the next control instead of trapping focus
  if (typing && el.tagName === "INPUT" && !e.defaultPrevented && (e.key === "ArrowUp" || e.key === "ArrowDown"
      || e.key === "ArrowLeft" && el.selectionStart === 0 && el.selectionEnd === 0
      || e.key === "ArrowRight" && el.selectionStart === el.value.length)) typing = false;
  if ((pref("tv", TV_DEFAULT) || padUsed) && e.key.startsWith("Arrow") && !typing && !e.defaultPrevented) { e.preventDefault(); return spatialMove(e.key); }
  if (song() && !typing && e.key === " " && !e.target.closest?.("button, select")) { e.preventDefault(); return toggleMusic(); }
  if (e.key === "Escape" && !$("#mfull").hidden) return $("#mfull").hidden = true;
  if (e.key === "Escape") {
    if ($("#detail").classList.contains("open")) closeDetail();
    else if (pref("tv", TV_DEFAULT) && !$("header").contains(document.activeElement)) { lastSpot = document.activeElement; openMenu(); }
    else if ((pref("tv", TV_DEFAULT) || padUsed) && $("#main").dataset.page !== "home") go("home");
  }
  if (e.key === "/" && !typing) { e.preventDefault(); $(".search input").focus(); }
});

// ---------- Android app ----------
function androidWatch(v, list) {
  closeDetail();
  pauseMusic();
  const pr = pref("resume", true) && progress()[v.id];
  const cats = mode => pref("sb", true) ? SB_CATS.map(c => c[0]).filter(c => c !== "poi_highlight" && sbMode(c) === mode) : [];
  const slim = x => ({ id: x.id, title: shownTitle(x), channel: x.channel || x.artist || "", duration: x.duration || 0,
    channel_id: x.channel_id || "", local: x.local || "" });
  ANDROID.playVideo(JSON.stringify({
    video: slim(v), list: (list?.length ? list : [v]).slice(0, 100).map(slim),
    start: pr && pr.t > 10 && pr.t < (pr.d || 1e9) - 30 ? pr.t : 0,
    quality: pref("quality", 1080) || 1080, skip: cats("skip"), ask: cats("button"),
    autoplay: pref("autoplay", true), cc: pref("ccLang", ""), ccAuto: pref("ccAuto", false),
    background: pref("bgPlay", true), pip: pref("pip", true),
  }));
}
// the native player reports back when it closes: what was watched, and where it stopped
window.androidVideoDone = json => {
  const r = JSON.parse(json);
  (r.played || []).forEach(v => !v.local && addHistory(v));
  if (r.quality) setPref("quality", r.quality);  // picked in the player's quality menu
  androidMusicKey = ""; androidMusic();  // the notification showed the video while it played in the background
  if (r.last?.id) r.last.pos > 10 && r.last.pos < r.last.dur - 15 ? saveProgress(r.last.id, r.last.pos, r.last.dur) : saveProgress(r.last.id, null);
};

// mirror the music player to Android's media session (notification, lock screen, TV "Now playing")
let androidMusicKey = "";
function androidMusic() {
  if (!ANDROID) return;
  const s = song(), a = ma();
  const st = s ? { id: s.id, title: s.title, artist: s.artist, album: s.album || "", playing: !a.paused, pos: a.currentTime,
    dur: isFinite(a.duration) ? a.duration : s.duration || 0, art: art(s.id, true) } : null;
  const key = JSON.stringify(st && { ...st, pos: Math.floor(st.pos / 10) });  // position only every 10s (Android extrapolates)
  if (key === androidMusicKey) return;
  androidMusicKey = key;
  ANDROID.musicState(JSON.stringify(st));
}
window.androidMedia = action => ({ play: () => ma().play(), pause: () => ma().pause(), next: () => nextSong(false),
  prev: prevSong, stop: stopMusic })[action]?.();
window.androidSeek = t => { ma().currentTime = +t; };
// Android back button: close the innermost thing; returns 1 if it handled it
window.androidBack = () => {
  if (!$("#ctx").hidden) return hideMenu(), 1;
  if ($("#detail").classList.contains("open")) return closeDetail(), 1;
  if (!$("#mfull").hidden) return ($("#mfull").hidden = true), 1;
  // TV: Back first opens the side menu, then goes home from there
  if (pref("tv", TV_DEFAULT) && !$("header").contains(document.activeElement)) return (lastSpot = document.activeElement), openMenu(), 1;
  if ($("#main").dataset.page !== "home") return go("home"), 1;
  return 0;
};

async function pcRemotePage() {
  noHero();
  pageHead("Remote control", "Play and control videos and music in TubeView on your TV or computer. On that device, turn on Settings → Phone remote.");
  const box = Object.assign(document.createElement("div"), { className: "tracks" });
  const manual = Object.assign(document.createElement("form"), { className: "msearch" });
  manual.innerHTML = `<input name="ip" placeholder="Or type its address, e.g. 192.168.1.20" inputmode="decimal" aria-label="PC address">
    <button class="btn primary">Connect</button>`;
  manual.onsubmit = e => {
    e.preventDefault();
    const ip = manual.ip.value.trim();
    if (/^[\w.-]+(:\d+)?$/.test(ip)) location.href = `http://${ip.includes(":") ? ip : ip + ":8766"}/`;
  };
  $("#main").append(box, manual);
  const scan = () => {
    box.innerHTML = '<p class="empty" style="padding:0">Looking for TubeView on your network…</p>';
    // discover() blocks for a moment (UDP broadcast), so let the page paint first
    setTimeout(() => {
      const pcs = JSON.parse(ANDROID.discover() || "[]");
      box.replaceChildren(...pcs.map(pc => {
        const b = Object.assign(document.createElement("button"), { className: "track" });
        b.innerHTML = `<span class="n">${icon('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>')}</span><span></span><div style="min-width:0"><div class="t">${esc(pc.name)}</div><div class="c">${esc(pc.ip)}</div></div>`;
        b.onclick = () => { location.href = `http://${pc.ip}:${pc.port}/`; };
        return b;
      }));
      if (!pcs.length) box.innerHTML = '<p class="empty" style="padding:0">Nothing found. Make sure Phone remote is on in TubeView on your TV or computer, and that it is on the same Wi-Fi as this phone.</p>';
      box.append(button("Search again", "ghost", scan));
    }, 50);
  };
  scan();
}

// ---------- phone remote: report what's playing, run the phone's commands (only while the remote is on) ----------
async function remoteSync() {
  if (!me.remote) return;
  const s = song(), a = ma(), v = pv();
  const state = {
    music: s ? { song: s, playing: !a.paused, t: a.currentTime, d: isFinite(a.duration) ? a.duration : s.duration || 0,
      volume: a.volume, shuffle: M.shuffle, repeat: M.repeat, queue: M.queue.slice(M.i + 1, M.i + 31) } : null,
    video: P.v ? { id: P.v.id, title: shownTitle(P.v), channel: P.v.channel, playing: !v.paused, t: now(), d: P.dur, live: P.live }
      : ANDROID?.videoState ? JSON.parse(ANDROID.videoState() || "null") : null,  // Android plays videos in its own player
  };
  const cmds = await fetch("/api/remote-sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) })
    .then(r => r.json()).catch(() => []);
  cmds.forEach(runRemote);
}
setInterval(remoteSync, 1000);

function runRemote(c) {
  const a = ma(), musicOn = !!song();
  // Android: the video is in the app's own player
  if (c.action.startsWith("video_") && c.action !== "video_play" && ANDROID?.videoCommand) return ANDROID.videoCommand(c.action, +c.t || 0);
  const vids = c.videos || [];
  ({
    toggle: () => musicOn ? toggleMusic() : P.v && toggle(),
    next: () => musicOn ? nextSong(false) : playNext(),
    prev: () => musicOn && prevSong(),
    seek: () => musicOn && isFinite(+c.t) && (a.currentTime = +c.t),
    volume: () => { const v = Math.max(0, Math.min(1, +c.v || 0)); musicEls().forEach(x => x.volume = v); setPref("musicVolume", v); },
    shuffle: () => musicOn && toggleShuffle(),
    repeat: () => musicOn && cycleRepeat(),
    play: () => c.songs?.length && playSongs(c.songs, Math.max(0, Math.min(c.songs.length - 1, +c.i || 0))),
    queue: () => c.song && queueSong(c.song, !!c.next),
    jump: () => musicOn && M.queue[M.i + 1 + (+c.i || 0)] && startSong(M.i + 1 + (+c.i || 0)),  // index into the "up next" list it was sent
    stop: () => stopMusic(),
    video_play: () => vids.length && watch(vids[Math.max(0, Math.min(vids.length - 1, +c.i || 0))], vids),
    video_toggle: () => P.v && toggle(),
    video_seek: () => P.v && isFinite(+c.t) && seek(+c.t),
    video_skip: () => P.v && isFinite(+c.t) && seek(now() + +c.t),
    video_next: () => P.v && playNext(),
    video_prev: () => P.v && seek(0),
    video_close: () => P.v && closePlayer(),
  })[c.action]?.();
}

// a "Watch" click on a new-upload notification asks TubeView to play that video (desktop only)
if (!ANDROID) setInterval(async () => {
  const v = await fetch("/api/open-request").then(r => r.json()).catch(() => null);
  if (v?.id) watch(v, [v]);
}, 3000);

// "Hey Google, play … on TubeView" (Android): what was asked for, or for just "play music", your For You mix
window.androidPlaySearch = async q => {
  const forYou = q ? null : await api("/api/music-foryou").catch(() => null);
  const list = q ? await api("/api/msearch?q=" + encodeURIComponent(q)).catch(() => [])
    : forYou?.mix?.length ? forYou.mix : store.get("musicHistory");
  if (!list.length) return toast(q ? `Couldn't find “${q}”` : "Play a few songs first, then ask again");
  playSongs(list, 0);
  openMusic("queue");
  toast(`Playing ${list[0].title}`);
};

dbLoad().then(() => {
  applyLayout();
  initMusic();  // after everything it uses (pref, svg, ...) is defined
  pv().volume = pref("volume", 1);
  return api("/api/me").then(m => {
    me = m; renderAccount();
  }).catch(() => {});
}).finally(() => {
  go("home");
  const asked = ANDROID?.takeVoiceSearch?.();  // a voice request that opened TubeView
  if (asked != null) androidPlaySearch(asked);
});
