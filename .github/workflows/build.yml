# Builds TubeView for Linux (AppImage) and Android (APK). The Windows build is off for now (it took far longer
# than the others); its steps are kept, so adding the windows-latest entry back to the matrix turns it on again.
# Runs on demand; pushing a tag like v1.2.0 (or running it with a version) also publishes the files as a GitHub release.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.0 (empty: build only)"
        required: false
      prerelease:
        description: "Publish it as a pre-release, for testing (the latest release stays the stable one)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # oldest supported glibc, so the AppImage runs on most distros
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install pyinstaller "yt-dlp[default]" PySide6

      - name: Bundle ffmpeg and deno (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p packaging/bin
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C packaging/bin --wildcards '*/bin/ffmpeg'
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -o deno.zip -d packaging/bin && rm deno.zip
          # libraries Qt WebEngine links against, so PyInstaller finds and bundles them
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-image0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Bundle ffmpeg and deno (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item ffmpeg-tmp/*/bin/ffmpeg.exe packaging/bin/
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath packaging/bin

      - name: Build app
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi packaging/tubeview.spec

      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool packaging/build_appimage.sh

      - name: Installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ inputs.version || github.ref_name }}" packaging/windows/tubeview.iss
          Compress-Archive dist/TubeView/* dist/TubeView-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tubeview-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/TubeView-Setup.exe
            dist/TubeView-windows-portable.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5  # Chaquopy needs the same Python version the app embeds
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: gradle assembleRelease --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk TubeView-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tubeview-android
          path: TubeView-android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # a run with a version creates that tag on the commit it built
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease != true }}
